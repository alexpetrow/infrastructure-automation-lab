---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: common_unattended_upgrades

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: common_unattended_upgrades

- name: Create journald config directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit journald disk usage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-limits.conf
    content: |
      [Journal]
      SystemMaxUse={{ common_journald_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Extend root logical volume to use all free space in the volume group
  community.general.lvol:
    vg: "{{ common_root_vg }}"
    lv: "{{ common_root_lv }}"
    size: +100%FREE
    resizefs: true
  when:
    - common_extend_root_lv
    - ansible_facts['lvm'] is defined
    - common_root_vg in (ansible_facts['lvm']['vgs'] | default({}))
    - (ansible_facts['lvm']['vgs'][common_root_vg]['free_g'] | float) > 0
