---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH with rate limiting
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp
    from_ip: "{{ firewall_ssh_allowed_from }}"
    comment: "SSH"

- name: Allow additional rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_allowed_rules }}"

- name: Set default policy for outgoing traffic
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Set logging level
  community.general.ufw:
    logging: "{{ firewall_logging }}"

- name: Enable UFW with default deny for incoming traffic
  community.general.ufw:
    state: enabled
    direction: incoming
    default: deny
